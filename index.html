/* ==================== UTILIDADES DE FECHA ==================== */
function hoyISO(){ var d = new Date(); return d.getFullYear() + "-" + pad2(d.getMonth()+1) + "-" + pad2(d.getDate()); }
function cargarLocal(key){ try{ var v = localStorage.getItem(key); return v ? JSON.parse(v) : null; }catch(e){ return null; } }
function guardarLocal(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }

function partesFecha(iso){
  if(!iso) return null;
  var s = String(iso);
  if(/^\d{4}-\d{2}-\d{2}/.test(s)){
    var p = s.slice(0,10).split("-");
    return { y:+p[0], m:+p[1], d:+p[2] };
  }
  var d = new Date(s);
  if(!isNaN(d.getTime())) return { y:d.getFullYear(), m:d.getMonth()+1, d:d.getDate() };
  return null;
}
function fmtFecha(iso){
  var p = partesFecha(iso);
  if(!p) return "—";
  return pad2(p.d) + "/" + pad2(p.m) + "/" + p.y;
}
function pad2(n){ return n < 10 ? "0"+n : ""+n; }
function upsertEnLista(lista, item){
  // Si ya existe, se reemplaza EN SU MISMA POSICIÓN (no se manda al final).
  var idx = -1;
  for(var i=0;i<lista.length;i++){ if(lista[i].id === item.id){ idx = i; break; } }
  var copia = lista.filter(function(x, j){ return x.id !== item.id || j === idx; });
  if(idx === -1){ copia.push(item); return copia; }
  var pos = copia.findIndex(function(x){ return x.id === item.id; });
  copia[pos] = item;
  return copia;
}
function ordenarPorId(lista){
  return lista.slice().sort(function(a,b){
    var na = parseInt(a.id,10), nb = parseInt(b.id,10);
    if(isNaN(na) || isNaN(nb)) return String(a.id).localeCompare(String(b.id));
    return na - nb;
  });
}
function isoDesdePartes(y,m,d){ return y + "-" + pad2(m) + "-" + pad2(d); }
function fmtId(n){ var s = String(n||"").replace(/[^0-9]/g,""); if(!s) return "—"; return s.length < 2 ? "0"+s : s; }
function siguienteId(lista){
  var max = 0;
  lista.forEach(function(x){ var n = parseInt(x.id,10); if(!isNaN(n) && n > max) max = n; });
  var siguiente = max + 1;
  return siguiente < 10 ? "0" + siguiente : String(siguiente);
}
function escapeHtml(str){
  return String(str==null?"":str).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function calcularEdad(fechaNac, refIso){
  var p = partesFecha(fechaNac);
  if(!p) return null;
  var ref = partesFecha(refIso || hoyISO());
  var edad = ref.y - p.y;
  if(ref.m < p.m || (ref.m === p.m && ref.d < p.d)) edad--;
  return edad;
}
function diasRestantes(fechaISO, refIso){
  var p = partesFecha(fechaISO);
  if(!p) return null;
  var fin = new Date(p.y, p.m-1, p.d);
  var r = partesFecha(refIso || hoyISO());
  var ref = new Date(r.y, r.m-1, r.d);
  return Math.round((fin - ref) / 86400000);
}
function estadoVigencia(fechaFin){
  var dias = diasRestantes(fechaFin);
  if(dias === null) return {label:"Sin registrar", cls:"bg-slate-100 text-slate-500", urgencia:99999};
  if(dias < 0) return {label:"Vencido (hace " + Math.abs(dias) + "d)", cls:"bg-red-100 text-red-700", urgencia:-1000000+dias};
  if(dias === 0) return {label:"Vence hoy", cls:"bg-red-100 text-red-700", urgencia:0};
  if(dias <= 30) return {label:"Por vencer (" + dias + "d)", cls:"bg-amber-100 text-amber-700", urgencia:dias};
  return {label:"Vigente", cls:"bg-emerald-100 text-emerald-700", urgencia:100000+dias};
}
function badgeEstadoPersonal(estado){
  var map = { "Activo":"bg-emerald-100 text-emerald-700", "Vacaciones":"bg-amber-100 text-amber-700",
    "Descanso Médico":"bg-purple-100 text-purple-700", "Inactivo":"bg-slate-200 text-slate-600" };
  return map[estado] || "bg-slate-100 text-slate-600";
}
function calcularHoras(horaInicio, horaFin){
  if(!horaInicio || !horaFin) return null;
  var a = horaInicio.split(":"), b = horaFin.split(":");
  if(a.length < 2 || b.length < 2) return null;
  var minA = (+a[0])*60 + (+a[1]), minB = (+b[0])*60 + (+b[1]);
  var dif = minB - minA;
  if(dif <= 0) return null;
  return Math.round((dif/60)*10)/10;
}
function badgeEstadoAsistencia(estado){
  var map = { "Asistió":"bg-emerald-100 text-emerald-700", "No asistió":"bg-red-100 text-red-700", "Permiso":"bg-amber-100 text-amber-700" };
  return map[estado] || "bg-slate-100 text-slate-600";
}

function lunesDeSemana(iso){
  var p = partesFecha(iso);
  var d = new Date(p.y, p.m-1, p.d);
  var diaSemana = d.getDay();
  var diff = diaSemana === 0 ? -6 : 1 - diaSemana;
  d.setDate(d.getDate() + diff);
  return isoDesdePartes(d.getFullYear(), d.getMonth()+1, d.getDate());
}
function sumarDias(iso, n){
  var p = partesFecha(iso);
  var d = new Date(p.y, p.m-1, p.d);
  d.setDate(d.getDate() + n);
  return isoDesdePartes(d.getFullYear(), d.getMonth()+1, d.getDate());
}
function numeroSemanaISO(iso){
  var p = partesFecha(iso);
  var d = new Date(Date.UTC(p.y, p.m-1, p.d));
  var dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  var yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
  return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
}
function diasDeLaSemana(lunesIso){
  var out = [];
  for(var i=0;i<7;i++) out.push(sumarDias(lunesIso, i));
  return out;
}

/* ==================== SYNC CON GOOGLE SHEETS ==================== */
function urlConClave(extra){ return SHEET_API + "?clave=" + encodeURIComponent(state.clave) + (extra || ""); }
async function cargarRecurso(recurso){
  try{
    if(!SHEET_API || SHEET_API.indexOf("PEGA_AQUI") === 0) return null;
    var controlador = new AbortController();
    var timeoutId = setTimeout(function(){ controlador.abort(); }, 15000);
    var r = await fetch(urlConClave("&recurso=" + recurso), { cache: "no-store", signal: controlador.signal });
    clearTimeout(timeoutId);
    var j = await r.json();
    if(Array.isArray(j)) return j;
    if(j && j.error) return j;
    return null;
  }catch(e){ return null; }
}
async function upsertRecurso(recurso, item){
  try{
    if(!SHEET_API || SHEET_API.indexOf("PEGA_AQUI") === 0) return;
    var controlador = new AbortController();
    var timeoutId = setTimeout(function(){ controlador.abort(); }, 15000);
    await fetch(urlConClave(), { method:"POST", body: JSON.stringify({ recurso: recurso, accion:"upsert", item: item }), signal: controlador.signal });
    clearTimeout(timeoutId);
  }catch(e){}
}
async function eliminarRecurso(recurso, id){
  try{
    if(!SHEET_API || SHEET_API.indexOf("PEGA_AQUI") === 0) return;
    var controlador = new AbortController();
    var timeoutId = setTimeout(function(){ controlador.abort(); }, 15000);
    await fetch(urlConClave(), { method:"POST", body: JSON.stringify({ recurso: recurso, accion:"eliminar", id: id }), signal: controlador.signal });
    clearTimeout(timeoutId);
  }catch(e){}
}
function sincronizarLista(recurso, listaNueva, guardarLocalKey){
  var anterior = servidorRef[recurso] || [];
  var am = {}; anterior.forEach(function(x){ am[x.id] = x; });
  var nm = {}; listaNueva.forEach(function(x){ nm[x.id] = x; });
  listaNueva.forEach(function(x){
    var prev = am[x.id];
    if(!prev || JSON.stringify(prev) !== JSON.stringify(x)){
      escriturasPendientes[recurso]++;
      upsertRecurso(recurso, x).finally(function(){ escriturasPendientes[recurso]--; });
    }
  });
  anterior.forEach(function(x){
    if(!nm[x.id]){
      escriturasPendientes[recurso]++;
      eliminarRecurso(recurso, x.id).finally(function(){ escriturasPendientes[recurso]--; });
    }
  });
  servidorRef[recurso] = listaNueva;
  guardarLocal(guardarLocalKey, listaNueva);
}

var RECURSO_ESTADO = { personal:"personal", asistencia:"asistencia", tareo:"tareo", empleadomes:"empleadoMes" };
var RECURSO_LS = { personal:LS_PERSONAL, asistencia:LS_ASISTENCIA, tareo:LS_TAREO, empleadomes:LS_EMPLEADO_MES };

async function cargaInicial(yaTienePersonal){
  var recursos = Object.keys(RECURSO_ESTADO).filter(function(r){ return !(yaTienePersonal && r === "personal"); });
  var resultados = await Promise.all(recursos.map(function(r){ return cargarRecurso(r); }));
  for(var i=0;i<recursos.length;i++){
    var recurso = recursos[i], datos = resultados[i];
    if(datos && datos.error === "unauthorized"){ cerrarSesion(); return; }
    if(Array.isArray(datos)){
      servidorRef[recurso] = datos;
      state[RECURSO_ESTADO[recurso]] = datos;
      guardarLocal(RECURSO_LS[recurso], datos);
    }
  }
  state.ultimoSync = new Date().toLocaleTimeString("es-PE");
  render();
  iniciarPolling();
}
var pollingIniciado = false;
function iniciarPolling(){
  if(pollingIniciado) return;
  pollingIniciado = true;
  setInterval(async function(){
    if(!state.autenticado) return;
    var recursos = Object.keys(RECURSO_ESTADO);
    var resultados = await Promise.all(recursos.map(function(r){ return cargarRecurso(r); }));
    var huboCambio = false;
    for(var i=0;i<recursos.length;i++){
      var recurso = recursos[i], datos = resultados[i];
      if(escriturasPendientes[recurso] > 0) continue;
      if(Array.isArray(datos) && JSON.stringify(datos) !== JSON.stringify(servidorRef[recurso])){
        servidorRef[recurso] = datos;
        state[RECURSO_ESTADO[recurso]] = datos;
        guardarLocal(RECURSO_LS[recurso], datos);
        huboCambio = true;
      }
    }
    state.ultimoSync = new Date().toLocaleTimeString("es-PE");
    if(huboCambio) render(); else actualizarBarraEstado();
  }, 8000);
}
function actualizarBarraEstado(){
  var el = document.getElementById("ultimoSync");
  if(el) el.textContent = "Última sincronización: " + (state.ultimoSync || "—");
}

/* ==================== LOGIN ==================== */
async function intentarLogin(){
  var val = document.getElementById("inputClave").value.trim();
  if(!val){ state.errorClave = "Ingresa la clave"; render(); return; }
  state.errorClave = "";
  state.verificandoLogin = true;
  render();

  var claveIntentada = val;
  var claveOriginal = state.clave;
  state.clave = claveIntentada; // necesario para que cargarRecurso arme la URL con esta clave
  var resultado = await cargarRecurso("personal");
  state.verificandoLogin = false;

  if(resultado && resultado.error === "unauthorized"){
    state.clave = claveOriginal;
    state.errorClave = "Clave incorrecta";
    render();
    return;
  }
  if(!Array.isArray(resultado)){
    state.clave = claveOriginal;
    state.errorClave = "No se pudo conectar. Intenta de nuevo.";
    render();
    return;
  }

  // La clave quedó confirmada como correcta por el propio servidor recién aquí.
  localStorage.setItem(LS_CLAVE, claveIntentada);
  state.autenticado = true;
  servidorRef.personal = resultado;
  state.personal = resultado;
  guardarLocal(LS_PERSONAL, resultado);
  render();
  cargaInicial(true); // true = ya tenemos "personal", no lo vuelvas a pedir
}
function cerrarSesion(){
  localStorage.removeItem(LS_CLAVE);
  state.clave = ""; state.autenticado = false;
  render();
}

/* ==================== ASISTENCIA ==================== */
function marcarAsistencia(personalId, nombre, estadoNuevo){
  var fecha = state.fechaAsistencia;
  var id = fecha + "__" + personalId;
  var lista = state.asistencia.slice();
  var idx = lista.findIndex(function(x){ return x.id === id; });
  var previo = idx >= 0 ? lista[idx] : null;

  if(previo && previo.estado === estadoNuevo){
    // clic sobre el estado que ya estaba activo => se quita la marca de asistencia de ese día
    state.asistencia = lista.filter(function(x){ return x.id !== id; });
    render();
    sincronizarLista("asistencia", state.asistencia, LS_ASISTENCIA);
    return;
  }

  var registro = { id:id, fecha:fecha, personalId:personalId, nombre:nombre, estado:estadoNuevo,
    horaInicio: estadoNuevo === "Permiso" ? (previo ? previo.horaInicio || "" : "") : "",
    horaFin: estadoNuevo === "Permiso" ? (previo ? previo.horaFin || "" : "") : "",
    horas: estadoNuevo === "Permiso" ? (previo ? previo.horas || "" : "") : "" };
  lista = upsertEnLista(lista, registro);
  state.asistencia = lista;
  render();
  sincronizarLista("asistencia", state.asistencia, LS_ASISTENCIA);
}
function actualizarHorarioPermiso(personalId, nombre, fecha, campo, valor){
  var id = fecha + "__" + personalId;
  var lista = state.asistencia.slice();
  var idx = lista.findIndex(function(x){ return x.id === id; });
  var actual = idx >= 0 ? Object.assign({}, lista[idx]) : { id:id, fecha:fecha, personalId:personalId, nombre:nombre, estado:"Permiso", horaInicio:"", horaFin:"", horas:"" };
  actual[campo] = valor;
  var horas = calcularHoras(actual.horaInicio, actual.horaFin);
  actual.horas = horas !== null ? String(horas) : "";
  lista = upsertEnLista(lista, actual);

  sincronizarLista("asistencia", state.asistencia, LS_ASISTENCIA);
}

  var id = fechaIso + "__" + personalId;

}
function obtenerTareo(personalId, fechaIso){
  var id = fechaIso + "__" + personalId;
  return state.tareo.find(function(x){ return x.id === id; }) || null;
}
function guardarTareaTexto(personalId, nombre, fechaIso, texto){
  var asis = obtenerAsistencia(personalId, fechaIso);
  if(asis && asis.estado === "No asistió") return; // no se permite registrar tarea si no asistió
  var id = fechaIso + "__" + personalId;
  var lista = state.tareo.slice();
  var idx = lista.findIndex(function(x){ return x.id === id; });
  var actual = idx >= 0 ? lista[idx] : { id:id, fecha:fechaIso, personalId:personalId, nombre:nombre, tarea:"", valorDia:"1" };
  actual = Object.assign({}, actual, { tarea: texto, nombre: nombre });
  lista = upsertEnLista(lista, actual);
  state.tareo = lista;
  sincronizarLista("tareo", state.tareo, LS_TAREO);
}
function cambiarValorDiaCelda(personalId, nombre, fechaIso, valor){
  var asis = obtenerAsistencia(personalId, fechaIso);
  if(asis && asis.estado === "No asistió") return;
  var id = fechaIso + "__" + personalId;
  var lista = state.tareo.slice();
  var existente = obtenerTareo(personalId, fechaIso);
  var valorMostrado = existente ? (existente.valorDia != null ? existente.valorDia : "1") : "1";
  var nuevoValor = (valorMostrado === valor) ? "" : valor; // clic sobre el que ya se ve activo = deseleccionar
  var actual = existente ? Object.assign({}, existente) : { id:id, fecha:fechaIso, personalId:personalId, nombre:nombre, tarea:"", valorDia:"1" };
  actual.valorDia = nuevoValor;
  lista = upsertEnLista(lista, actual);
  state.tareo = lista;
  render();
  sincronizarLista("tareo", state.tareo, LS_TAREO);
}
function totalSemanaPersona(personalId, dias){
  var total = 0;
  dias.forEach(function(f){
    var asis = obtenerAsistencia(personalId, f);
    if(asis && asis.estado === "No asistió") return;
    var t = obtenerTareo(personalId, f);
    if(t && t.tarea && t.tarea.trim() && t.valorDia){
      total += (t.valorDia === "1.5" ? 1.5 : 1);
    }
  });
  return total;
}

function datosParaExportar(tipo){
  if(tipo === "personal"){
    var filas = personalFiltrado();
    return {
      titulo: "Personal - REGISTRO DE PERSONAL",
      encabezados: ["ID","Nombre","DNI","Cargo","Área","Estado","F. Ingreso","Cumpleaños","Inicio Inducción","Fin Inducción","Inicio SCTR","Fin SCTR","Teléfono","Email"],
      filas: filas.map(function(p){
        return [fmtId(p.id), p.nombre, p.dni, p.cargo, p.area, p.estado, fmtFecha(p.fechaIngreso), fmtFecha(p.cumpleanos),
          fmtFecha(p.induccionInicio), fmtFecha(p.induccionFin), fmtFecha(p.sctrInicio), fmtFecha(p.sctrFin), p.telefono, p.email];
      })
    };
  }
  if(tipo === "asistencia"){
    var fecha = state.fechaAsistencia;
    var activos = state.personal.filter(function(p){ return p.estado !== "Inactivo"; });
    var mapa = {};
    state.asistencia.forEach(function(a){ if(a.fecha === fecha) mapa[a.personalId] = a; });
    return {
      titulo: "Asistencia del " + fmtFecha(fecha),
      encabezados: ["Nombre","Cargo","Estado","Hora inicio permiso","Hora fin permiso","Horas trabajadas"],
      filas: activos.map(function(p){
        var r = mapa[p.id];
        return [p.nombre, p.cargo, r ? r.estado : "—", r ? r.horaInicio||"" : "", r ? r.horaFin||"" : "", r ? r.horas||"" : ""];
      })
    };
  }
  if(tipo === "tareo"){
    var dias = diasDeLaSemana(state.semanaInicio);
    var activosT = state.personal.filter(function(p){ return p.estado !== "Inactivo"; });
    var encab = ["Personal"].concat(dias.map(function(f,i){ return DIAS_SEMANA[i] + " " + fmtFecha(f); })).concat(["Total días"]);
    var filasT = activosT.map(function(p){
      var fila = [p.nombre];
      dias.forEach(function(f){
        var t = obtenerTareo(p.id, f);
        fila.push(t ? t.tarea : "");
      });
      fila.push(totalSemanaPersona(p.id, dias));
      return fila;
    });
    return { titulo: "Tareo semana " + fmtFecha(dias[0]) + " al " + fmtFecha(dias[6]), encabezados: encab, filas: filasT };
  }
  return { titulo: "Datos", encabezados: [], filas: [] };
}
function exportarExcelTabla(tipo){
  var d = datosParaExportar(tipo);
  var hoja = XLSX.utils.aoa_to_sheet([d.encabezados].concat(d.filas));
  var libro = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(libro, hoja, "Datos");
  XLSX.writeFile(libro, d.titulo.replace(/[^a-zA-Z0-9 _-]/g,"") + ".xlsx");
}
function exportarPdfTabla(tipo){
  var d = datosParaExportar(tipo);
  var doc = new window.jspdf.jsPDF({ orientation: d.encabezados.length > 6 ? "landscape" : "portrait" });
  doc.setFontSize(12);
  doc.text(d.titulo, 14, 14);
  doc.autoTable({ head: [d.encabezados], body: d.filas, startY: 20, styles: { fontSize: 8 }, headStyles: { fillColor: [30,58,138] } });
  doc.save(d.titulo.replace(/[^a-zA-Z0-9 _-]/g,"") + ".pdf");
}

function detalleDashboard(id, cumples, inducciones, sctrs, presentesRef, mesLabel, ref){
  var titulo = "", filas = "";
  if(id === "cumple"){
    titulo = "Cumpleaños de " + mesLabel.toLowerCase();
    filas = cumples.length ? cumples.map(function(x){
      var pf = partesFecha(x.cumpleanos);
      var edad = partesFecha(ref).y - pf.y;
      return filaDetalle(pad2(pf.d)+"/"+pad2(pf.m), escapeHtml(x.nombre), "cumple " + edad + " años");
    }).join("") : filaVacia("Nadie cumple años este mes.");
  } else if(id === "induccion"){
    titulo = "Inducciones que requieren atención";
    filas = inducciones.length ? inducciones.map(function(x){
      return filaDetalle(fmtFecha(x.p.induccionFin), escapeHtml(x.p.nombre), x.vig.label, x.vig.cls);
    }).join("") : filaVacia("Todas las inducciones están vigentes.");
  } else if(id === "sctr"){
    titulo = "SCTR que requieren atención";
    filas = sctrs.length ? sctrs.map(function(x){
      return filaDetalle(fmtFecha(x.p.sctrFin), escapeHtml(x.p.nombre), x.vig.label, x.vig.cls);
    }).join("") : filaVacia("Todos los SCTR están vigentes.");
  } else if(id === "presentes"){
    titulo = "Asistencia del " + fmtFecha(ref);
    filas = presentesRef.length ? presentesRef.map(function(a){
      if(a.estado === "Permiso"){
        var detallePermiso = a.horas ? a.horas + " h trabajadas" : "Permiso";
        if(a.horaInicio && a.horaFin) detallePermiso += " (" + a.horaInicio + " a " + a.horaFin + ")";
        return filaDetalle("🔴", escapeHtml(a.nombre), detallePermiso, "bg-amber-100 text-amber-700");
      }
      return filaDetalle("✓", escapeHtml(a.nombre), "Asistió", "bg-emerald-100 text-emerald-700");
    }).join("") : filaVacia("Nadie tiene asistencia registrada ese día.");
  }
  return '<div class="bg-white rounded-2xl border border-slate-200 p-4">' +
    '<div class="font-bold text-slate-800 mb-3">' + titulo + '</div>' +
    '<div class="divide-y divide-slate-100">' + filas + '</div>' +
  '</div>';
}

    '<div class="flex items-center gap-3"><span class="text-slate-400 font-mono text-[12px] w-14">' + izq + '</span><span class="font-medium text-slate-800">' + nombre + '</span></div>' +
    '<span class="px-2.5 py-1 rounded-full text-[11px] font-semibold ' + (cls || "bg-slate-100 text-slate-600") + '">' + etiqueta + '</span>' +
  '</div>';

    panelHoras = '<div class="flex items-center gap-2 mt-2 text-[12px]">' +
      '<span class="text-slate-500">Permiso de</span>' +
      '<input type="time" value="' + horaIni + '" onchange="actualizarHorarioPermiso(\'' + p.id + '\',\'' + nombreEsc + '\',\'' + state.fechaAsistencia + '\',\'horaInicio\',this.value)" class="h-8 px-2 rounded-lg border border-amber-300 bg-amber-50" />' +
      '<span class="text-slate-500">a</span>' +
      '<input type="time" value="' + horaFinV + '" onchange="actualizarHorarioPermiso(\'' + p.id + '\',\'' + nombreEsc + '\',\'' + state.fechaAsistencia + '\',\'horaFin\',this.value)" class="h-8 px-2 rounded-lg border border-amber-300 bg-amber-50" />' +
      (registro.horaInicio && registro.horaFin && registro.horas ? '<span class="font-semibold text-amber-700">' + registro.horas + ' h trabajadas</span>' : '<span class="text-slate-400">Ingresa el rango de horas</span>') +
    '</div>';
  }
  return '<tr class="hover:bg-slate-50">' +
    td('<span class="font-semibold text-slate-800">' + escapeHtml(p.nombre) + '</span>') +
    td(escapeHtml(p.cargo)) +
    td('<div class="flex gap-1.5 flex-wrap">' + botones + '</div>' + panelHoras) +
  '</tr>';
}

/* ==================== RENDER: TAB TAREO SEMANAL ==================== */
function toggleVistaTareo(){ state.vistaTareoDia = !state.vistaTareoDia; render(); }
function vistaTabTareo(){
  var dias = diasDeLaSemana(state.semanaInicio);
  var numSemana = numeroSemanaISO(state.semanaInicio);
  var activos = state.personal.filter(function(p){ return p.estado !== "Inactivo"; });

  var indiceHoy = dias.indexOf(hoyISO());
  var indiceMostrar = indiceHoy >= 0 ? indiceHoy : 0;
  var diasConIndice = dias.map(function(f,i){ return { fecha:f, indice:i }; });
  var diasAMostrar = state.vistaTareoDia ? [diasConIndice[indiceMostrar]] : diasConIndice;

  var encabezadosDias = diasAMostrar.map(function(d){
    var pf = partesFecha(d.fecha);
    return '<th class="text-center font-semibold px-2 py-2.5 whitespace-nowrap">' +
      '<div>' + DIAS_SEMANA[d.indice] + '</div><div class="text-[10px] text-slate-400 font-normal">' + pad2(pf.d) + '/' + pad2(pf.m) + '</div>' +
    '</th>';
  }).join("");

  var fechasAMostrar = diasAMostrar.map(function(d){ return d.fecha; });
  var filas = activos.length ? activos.map(function(p){ return filaTareoHtml(p, fechasAMostrar, dias); }).join("") :
    '<tr><td colspan="9" class="text-center text-sm text-slate-400 py-10">No hay personal activo registrado.</td></tr>';

  return '' +
  '<div class="max-w-6xl mx-auto px-4 py-5">' +
    '<div class="flex flex-wrap items-center gap-3 mb-4">' +
      '<div>' +
        '<label class="text-xs font-semibold uppercase tracking-wide text-slate-500 block">Semana</label>' +
        '<div class="flex items-center gap-2">' +
          '<button onclick="cambiarSemana(-1)" class="w-9 h-9 rounded-lg border border-slate-200 hover:bg-slate-50">←</button>' +
          '<div class="px-3 py-2 rounded-xl bg-slate-100 text-sm font-semibold">SEM ' + numSemana + ' — ' + fmtFecha(dias[0]) + ' al ' + fmtFecha(dias[6]) + '</div>' +
          '<button onclick="cambiarSemana(1)" class="w-9 h-9 rounded-lg border border-slate-200 hover:bg-slate-50">→</button>' +
          '<input type="date" value="' + state.semanaInicio + '" onchange="irASemanaDe(this.value)" class="h-9 px-2 rounded-lg border border-slate-200 text-sm" />' +
        '</div>' +
      '</div>' +
      '<div class="ml-auto flex gap-2">' +
        '<button onclick="toggleVistaTareo()" class="h-9 px-3 rounded-xl border border-slate-200 text-[13px] font-semibold hover:bg-slate-50">' + (state.vistaTareoDia ? '📅 Semana completa' : '📱 Solo hoy') + '</button>' +
        '<button onclick="abrirHistorialTareo()" class="h-9 px-3 rounded-xl border border-slate-200 text-[13px] font-semibold hover:bg-slate-50">🕓 Historial</button>' +
        '<button onclick="exportarExcelTabla(\'tareo\')" class="h-9 px-3 rounded-xl border border-slate-200 text-[13px] font-semibold hover:bg-slate-50">Excel</button>' +
        '<button onclick="exportarPdfTabla(\'tareo\')" class="h-9 px-3 rounded-xl border border-slate-200 text-[13px] font-semibold hover:bg-slate-50">PDF</button>' +
      '</div>' +
    '</div>' +
    '<div class="bg-white rounded-2xl border border-slate-200 overflow-x-auto">' +
      '<table class="w-full text-sm">' +
        '<thead><tr class="bg-slate-50 text-slate-500 text-[11px] uppercase tracking-wide">' + th("Personal") + encabezadosDias + th("Total") + '</tr></thead>' +
        '<tbody class="divide-y divide-slate-100">' + filas + '</tbody>' +
      '</table>' +
    '</div>' +
  '</div>';
}
function filaTareoHtml(p, fechasAMostrar, diasSemanaCompleta){
  var celdas = fechasAMostrar.map(function(f){ return celdaTareoHtml(p, f); }).join("");
  var total = totalSemanaPersona(p.id, diasSemanaCompleta);
  return '<tr class="hover:bg-slate-50">' +
    td('<span class="font-semibold text-slate-800">' + escapeHtml(p.nombre) + '</span>') +
    celdas +
    td('<span class="font-bold text-blue-900">' + total + ' día' + (total===1?'':'s') + '</span>') +
  '</tr>';
}
function celdaTareoHtml(p, fechaIso){
  var t = obtenerTareo(p.id, fechaIso);
  var texto = t ? t.tarea : "";
  var valor = t ? (t.valorDia != null ? t.valorDia : "1") : "1";
  var nombreEsc = escapeHtml(p.nombre).replace(/'/g,"\\'");
  var asis = obtenerAsistencia(p.id, fechaIso);
  var estadoAsis = asis ? asis.estado : null;

  if(estadoAsis === "No asistió"){
    return '<td class="px-2 py-2 align-top bg-red-50">' +
      '<input type="text" value="" placeholder="No asistió" disabled ' +
        'class="celda-tarea w-full h-9 px-2 rounded-lg border border-red-200 bg-red-50 text-[13px] text-red-400 cursor-not-allowed" />' +
      '<div class="text-[10px] text-red-500 text-center mt-1">No registró asistencia</div>' +
    '</td>';
  }

  var fondoCelda = estadoAsis === "Permiso" ? "bg-amber-50" : "";
  var horasInfo = "";
  if(estadoAsis === "Permiso" && asis.horaInicio && asis.horaFin && asis.horas){
    horasInfo = '<div class="text-[10px] text-blue-600 text-center mt-1 font-semibold">' + asis.horas + ' horas trabajadas</div>';
  }

  return '<td class="px-2 py-2 align-top ' + fondoCelda + '">' +
    '<input type="text" value="' + escapeHtml(texto) + '" placeholder="—" ' +
      'onchange="guardarTareaTexto(\'' + p.id + '\',\'' + nombreEsc + '\',\'' + fechaIso + '\',this.value)" ' +
      'class="celda-tarea w-full h-9 px-2 rounded-lg border ' + (estadoAsis === "Permiso" ? "border-amber-300" : "border-slate-200") + ' text-[13px] focus:ring-2 focus:ring-blue-800 outline-none" />' +
    '<div class="flex gap-1 mt-1 justify-center">' +
      botonValorDia(p.id, nombreEsc, fechaIso, "1", valor, "1") +
      botonValorDia(p.id, nombreEsc, fechaIso, "1.5", valor, "1 ½") +
    '</div>' +
    horasInfo +
  '</td>';
}
function botonValorDia(personalId, nombreEsc, fechaIso, valor, valorActual, label){
  var activo = valorActual === valor;
  return '<button onclick="cambiarValorDiaCelda(\'' + personalId + '\',\'' + nombreEsc + '\',\'' + fechaIso + '\',\'' + valor + '\')" ' +
    'class="px-2 py-0.5 rounded text-[10px] font-bold ' + (activo ? 'bg-blue-900 text-white' : 'bg-slate-100 text-slate-500 hover:bg-slate-200') + '">' + label + '</button>';
}

/* ==================== RENDER PRINCIPAL ==================== */
function render(){
  var app = document.getElementById("app");
  if(!state.autenticado){ app.innerHTML = vistaLogin(); return; }
  var vista = state.tab === "personal" ? vistaTabPersonal()
    : state.tab === "asistencia" ? vistaTabAsistencia()
    : state.tab === "tareo" ? vistaTabTareo()
    : vistaTabResumen();
  app.innerHTML = vistaHeader() + vista + vistaModalPersonal() + vistaConfirmarBorrar() + vistaModalEmpleadoMes() + vistaModalHistorialAsistencia() + vistaModalHistorialTareo();
}

/* ==================== INICIO ==================== */
render();
if(state.autenticado) cargaInicial();
</script>
</body>
</html>
